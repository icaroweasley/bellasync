<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agendamento Online — Metamorfose Hair</title>
  <link rel="stylesheet" href="/css/crm.css">
  <style>
    body {
      background: #faf7f5;
      display: block;
      padding-bottom: 40px;
    }
    .booking-wrapper {
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .booking-header {
      text-align: center;
      padding: 26px 20px;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border-peach);
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }
    .booking-header h1 {
      font-size: 1.35rem;
      font-weight: var(--weight-bold);
      color: var(--ink);
    }
    .booking-header p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .accordion-category {
      background: var(--surface);
      border: 1px solid var(--border-peach);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(44, 35, 29, 0.04);
    }
    .category-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: var(--weight-semibold);
      background: var(--surface);
      transition: background 0.2s;
    }
    .category-header:hover {
      background: var(--panel);
    }
    .category-body {
      padding: 0 16px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .category-body.open {
      display: flex;
    }
    .service-book-card {
      padding: 14px 16px;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid rgb(255 233 218 / 60%);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .service-book-info h4 {
      font-size: 0.98rem;
      font-weight: var(--weight-semibold);
      color: var(--ink);
    }
    .service-book-info span {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-top: 3px;
    }
    .service-book-cta {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .duration-badge {
      display: inline-block;
      background: var(--orange-soft);
      color: var(--orange);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: var(--weight-bold);
    }
  </style>
</head>
<body>
  <div class="booking-wrapper">
    <div class="booking-header">
      <div style="display:inline-block;">
        <div class="salon-avatar" style="width:70px; height:70px; font-size:1.6rem; margin: 0 auto 10px;">MH</div>
      </div>
      <p style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--orange); font-weight: var(--weight-bold);">Seja bem-vindo(a) ao</p>
      <h1 id="bSalonName">Metamorfose Hair</h1>
      <p id="bSalonPhone">(67) 98424-8821</p>
      <small style="color:var(--muted); margin-top:6px; display:block;">Agende online com disponibilidade em tempo real</small>
    </div>

    <h3 style="font-size: 1.15rem; font-weight: var(--weight-bold); margin-bottom: 14px; padding-left: 4px;">Selecione o Serviço Desejado</h3>
    <div id="servicesAccordion"></div>
  </div>

  <!-- Modal Interativo de Agendamento com Grade de Disponibilidade -->
  <div class="modal-backdrop" id="bookingModal">
    <div class="modal-dialog" style="max-width: 540px;">
      <div class="modal-header">
        <div>
          <h3 id="bModalTitle">Reservar Horário</h3>
          <span id="bModalDuration" class="duration-badge" style="margin-top:4px;">Duração: 60 min</span>
        </div>
        <button onclick="closeBookingModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted);">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="bookServId">
        
        <div class="form-group">
          <label>1. Escolha o Profissional</label>
          <select class="form-control" id="bookProfSelect" onchange="fetchAvailableSlots()"></select>
        </div>

        <div class="form-group">
          <label>2. Data Desejada</label>
          <input type="date" class="form-control" id="bookDate" onchange="fetchAvailableSlots()">
        </div>

        <div class="form-group">
          <label style="display:flex; justify-content:space-between; align-items:center;">
            <span>3. Escolha o Horário Disponível</span>
            <small style="color:var(--orange); font-size:0.75rem; font-weight:var(--weight-semibold);">Apenas vagas livres</small>
          </label>
          <div class="slots-table-container" id="slotsContainer">
            <div style="padding: 20px; text-align: center; color: var(--muted); font-size: 0.88rem;">
              Carregando horários disponíveis...
            </div>
          </div>
          <div id="selectedSlotNotice" style="margin-top:8px; font-size:0.85rem; color:var(--orange); font-weight:var(--weight-semibold); min-height:20px;">
            Nenhum horário selecionado.
          </div>
        </div>

        <div style="border-top: 1px solid var(--border-peach); padding-top: 14px;">
          <div class="form-group" style="margin-bottom:12px;">
            <label>4. Seu Nome Completo</label>
            <input type="text" class="form-control" id="bookClientName" placeholder="Ex: Lucas Ferreira">
          </div>
          <div class="form-group">
            <label>5. Seu WhatsApp</label>
            <input type="text" class="form-control" id="bookClientPhone" placeholder="(67) 99999-9999">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-falcon btn-secondary" onclick="closeBookingModal()">Voltar</button>
        <button class="btn-falcon btn-primary" id="btnConfirmBooking" onclick="confirmOnlineBooking()" disabled>Confirmar Agendamento</button>
      </div>
    </div>
  </div>

  <script>
    let services = [];
    let professionals = [];
    let settings = {};
    let selectedService = null;
    let selectedSlot = null; // { time, endTime }

    let salonSlug = new URLSearchParams(window.location.search).get('salao') || 'metamorfose_hair';
    let currentTenantId = 'tenant_metamorfose';

    document.addEventListener('DOMContentLoaded', async () => {
      const dateInput = document.getElementById('bookDate');
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      dateInput.value = todayStr;
      dateInput.min = todayStr;

      try {
        const res = await fetch(`/api/public/salon/${salonSlug}`);
        if (!res.ok) {
          throw new Error('Falha ao obter salão');
        }
        const data = await res.json();
        services = data.services || [];
        professionals = (data.professionals || []).filter(p => p.showInBooking !== false);
        settings = data.tenant.settings || {};
        currentTenantId = data.tenant.id;

        if (data.tenant.name) {
          document.getElementById('bSalonName').innerText = data.tenant.name;
          document.title = `Agendamento Online — ${data.tenant.name}`;
        }
        if (data.tenant.phone) document.getElementById('bSalonPhone').innerText = data.tenant.phone;

        renderAccordion();
      } catch (err) {
        console.warn("Carregando via fallback padrão...");
        const [sRes, pRes, setRes] = await Promise.all([
          fetch('/api/services').then(r => r.json()),
          fetch('/api/professionals').then(r => r.json()),
          fetch('/api/settings').then(r => r.json())
        ]);
        services = sRes;
        professionals = pRes.filter(p => p.showInBooking && p.active);
        settings = setRes;
        if (settings.salonName) document.getElementById('bSalonName').innerText = settings.salonName;
        if (settings.phone) document.getElementById('bSalonPhone').innerText = settings.phone;
        renderAccordion();
      }
    });

    function renderAccordion() {
      const categories = [...new Set(services.map(s => s.category || 'Outros'))];
      const accordion = document.getElementById('servicesAccordion');

      accordion.innerHTML = categories.map((cat, idx) => {
        const catServices = services.filter(s => (s.category || 'Outros') === cat);
        const servicesHtml = catServices.map(s => `
          <div class="service-book-card">
            <div class="service-book-info">
              <h4>${s.name}</h4>
              <span>🕒 Duração: <strong>${s.durationMinutes} min</strong></span>
              ${s.observation ? `<small style="color:#999; font-size:0.75rem;">${s.observation}</small>` : ''}
            </div>
            <div class="service-book-cta">
              <span class="item-badge-price">R$ ${s.price.toFixed(2)}</span>
              <button class="btn-falcon btn-success" style="padding: 7px 16px; font-size:0.82rem;" onclick="openBookingModal('${s.id}')">
                Reservar
              </button>
            </div>
          </div>
        `).join('');

        return `
          <div class="accordion-category">
            <div class="category-header" onclick="toggleCategory(${idx})">
              <span>${cat} <small style="color:var(--muted)">(${catServices.length} serviço${catServices.length > 1 ? 's' : ''})</small></span>
              <span id="cat-arrow-${idx}">▼</span>
            </div>
            <div class="category-body ${idx === 0 ? 'open' : ''}" id="cat-body-${idx}">
              ${servicesHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCategory(idx) {
      const body = document.getElementById(`cat-body-${idx}`);
      body.classList.toggle('open');
      document.getElementById(`cat-arrow-${idx}`).innerText = body.classList.contains('open') ? '▲' : '▼';
    }

    function openBookingModal(serviceId) {
      selectedService = services.find(s => s.id === serviceId);
      selectedSlot = null;
      document.getElementById('btnConfirmBooking').disabled = true;
      document.getElementById('selectedSlotNotice').innerText = 'Nenhum horário selecionado.';

      document.getElementById('bModalTitle').innerText = selectedService.name;
      document.getElementById('bModalDuration').innerText = `Duração total: ${selectedService.durationMinutes} minutos`;
      document.getElementById('bookServId').value = serviceId;

      const profSelect = document.getElementById('bookProfSelect');
      profSelect.innerHTML = professionals.map(p => `<option value="${p.id}">${p.name} (${p.role})</option>`).join('');

      document.getElementById('bookingModal').classList.add('open');
      fetchAvailableSlots();
    }

    function closeBookingModal() {
      document.getElementById('bookingModal').classList.remove('open');
    }

    async function fetchAvailableSlots() {
      const profId = document.getElementById('bookProfSelect').value;
      const date = document.getElementById('bookDate').value;
      const container = document.getElementById('slotsContainer');
      selectedSlot = null;
      document.getElementById('btnConfirmBooking').disabled = true;
      document.getElementById('selectedSlotNotice').innerText = 'Nenhum horário selecionado.';

      if (!profId || !date || !selectedService) return;

      container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Buscando horários na agenda...</div>';

      try {
        const res = await fetch(`/api/appointments/availability?date=${date}&professionalId=${profId}&serviceId=${selectedService.id}`, {
          headers: { 'x-tenant-id': currentTenantId }
        });
        const data = await res.json();

        const availableSlots = (data.slots || []).filter(s => s.available);

        if (availableSlots.length === 0) {
          container.innerHTML = `
            <div style="padding:28px 20px; text-align:center; color:var(--muted);">
              <div style="font-size:1.6rem; margin-bottom:6px;">📅</div>
              <strong style="color:var(--ink); font-size:0.95rem;">Não há mais horários disponíveis para este dia.</strong>
              <div style="font-size:0.82rem; margin-top:4px;">Por favor selecione outra data acima ou outro profissional.</div>
            </div>
          `;
          return;
        }

        const gridHtml = availableSlots.map(slot => `
          <div class="slot-item-btn" onclick="selectSlot('${slot.time}', '${slot.endTime}', this)">
            <span style="font-size:0.95rem; color:var(--ink);">${slot.time}</span>
            <small style="color:var(--muted);">até ${slot.endTime}</small>
          </div>
        `).join('');

        container.innerHTML = `<div class="slots-grid">${gridHtml}</div>`;
      } catch (err) {
        console.error("Erro ao buscar slots:", err);
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--red);">Erro ao carregar horários.</div>';
      }
    }

    function selectSlot(time, endTime, element) {
      document.querySelectorAll('.slot-item-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
      selectedSlot = { time, endTime };

      document.getElementById('selectedSlotNotice').innerHTML = `
        ✓ Horário escolhido: <strong>${time} às ${endTime}</strong> (${selectedService.durationMinutes} min)
      `;
      document.getElementById('btnConfirmBooking').disabled = false;
    }

    async function confirmOnlineBooking() {
      if (!selectedSlot) {
        alert('Por favor selecione um horário disponível na tabela.');
        return;
      }

      const name = document.getElementById('bookClientName').value.trim();
      const phone = document.getElementById('bookClientPhone').value.trim();
      const profId = document.getElementById('bookProfSelect').value;
      const date = document.getElementById('bookDate').value;

      if (!name || !phone) {
        alert('Por favor preencha seu nome completo e WhatsApp para confirmação.');
        return;
      }

      const prof = professionals.find(p => p.id === profId);
      const btn = document.getElementById('btnConfirmBooking');
      btn.disabled = true;
      btn.innerText = 'Agendando...';

      try {
        const response = await fetch('/api/appointments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-tenant-id': currentTenantId
          },
          body: JSON.stringify({
            professionalId: profId,
            clientName: name,
            clientPhone: phone,
            serviceId: selectedService.id,
            serviceName: selectedService.name,
            price: selectedService.price,
            date: date,
            startTime: selectedSlot.time,
            endTime: selectedSlot.endTime,
            status: 'agendado',
            notes: `Agendamento Online (${selectedService.durationMinutes} min)`
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          alert(errData.error || 'Erro ao realizar agendamento.');
          btn.disabled = false;
          btn.innerText = 'Confirmar Agendamento';
          fetchAvailableSlots();
          return;
        }

        closeBookingModal();
        alert(`🎉 Agendamento confirmado com sucesso!\n\nCliente: ${name}\nProfissional: ${prof.name}\nServiço: ${selectedService.name} (${selectedService.durationMinutes} min)\nData: ${date} das ${selectedSlot.time} às ${selectedSlot.endTime}`);
      } catch (err) {
        console.error(err);
        alert('Ocorreu um erro ao comunicar com o servidor.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Confirmar Agendamento';
      }
    }
  </script>
</body>
</html>
