<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login & Acesso — BellaSync Gestão</title>
  <link rel="icon" type="image/png" href="/images/logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/crm.css">
  <style>
    body {
      background: #eef2ee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: var(--font-stack, "Poppins", sans-serif);
      position: relative;
    }
    .auth-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(1.25);
      -webkit-backdrop-filter: blur(24px) saturate(1.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 28px;
      padding: 44px 38px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.28), 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #141414;
      color: #ffffff;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .auth-header p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-tab-btn.active {
      background: #ffffff;
      color: #111111;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .auth-form-group {
      margin-bottom: 16px;
    }
    .auth-form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .auth-form-group input {
      width: 100%;
      padding: 11px 15px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-form-group input:focus {
      background: #ffffff;
      border-color: var(--orange, #ff6900);
      box-shadow: 0 0 0 3px rgba(255, 105, 0, 0.15);
    }
    .btn-auth-submit {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #ff6900 0%, #ff5200 100%);
      color: #ffffff;
      border: 1px solid #ea580c;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 105, 0, 0.28);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 10px;
      font-family: inherit;
    }
    .btn-auth-submit:hover {
      background: linear-gradient(135deg, #ea580c 0%, #d9480f 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 105, 0, 0.38);
    }
    .auth-footer-help {
      margin-top: 22px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      padding-top: 16px;
    }
    .auth-footer-help strong {
      color: var(--ink);
    }
  </style>
</head>
<body>
  <!-- Animated Colorful Gradient Orbs with Blur Background -->
  <div class="animated-bg" aria-hidden="true">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="gradient-orb orb-4"></div>
    <div class="gradient-orb orb-5"></div>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <img src="/images/logo.png?v=4" alt="BellaSync Logo" style="width: 175px; height: auto; object-fit: contain; margin-bottom: 6px; filter: drop-shadow(0 6px 16px rgba(255, 105, 0, 0.18));">
      <p id="authSubtitle" style="margin-top: 4px;">Sistema de Gestão & Agendamento para Salões</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tabBtnLogin" onclick="switchAuthTab('login')">Entrar na Conta</button>
      <button class="auth-tab-btn" id="tabBtnRegister" onclick="switchAuthTab('register')">Cadastrar Salão</button>
    </div>

    <!-- Form de Login -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="auth-form-group">
        <label>Usuário de Acesso</label>
        <input type="text" id="loginUsername" placeholder="Digite seu usuário" autocomplete="username" required>
      </div>
      <div class="auth-form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-auth-submit" id="btnLoginSubmit">Entrar no Sistema</button>
    </form>

    <!-- Form de Cadastro de Novo Salão (Multi-Tenant) -->
    <form id="registerForm" style="display: none;" onsubmit="handleRegisterSalon(event)">
      <div class="auth-form-group">
        <label>Nome do Salão</label>
        <input type="text" id="regSalonName" placeholder="Ex: Studio Bella Hair" required>
      </div>
      <div class="auth-form-group">
        <label>Identificador URL (Slug)</label>
        <input type="text" id="regSalonSlug" placeholder="Ex: studio_bella" required>
      </div>
      <div class="auth-form-group">
        <label>Telefone / WhatsApp</label>
        <input type="text" id="regSalonPhone" placeholder="(67) 99999-9999" required>
      </div>
      <div class="auth-form-group">
        <label>Endereço</label>
        <input type="text" id="regSalonAddress" placeholder="Rua / Bairro / Cidade">
      </div>
      <div class="auth-form-group">
        <label>Nome do Gestor / Proprietário</label>
        <input type="text" id="regAdminName" placeholder="Seu nome completo" required>
      </div>
      <div class="auth-form-group">
        <label>Usuário de Acesso (Login)</label>
        <input type="text" id="regAdminUser" placeholder="Ex: gestor ou seu_nome" required>
      </div>
      <div class="auth-form-group">
        <label>Email de Contato</label>
        <input type="email" id="regAdminEmail" placeholder="contato@seusalao.com">
      </div>
      <div class="auth-form-group">
        <label>Criar Senha</label>
        <input type="password" id="regAdminPassword" placeholder="Mínimo 3 caracteres" required>
      </div>
      <button type="submit" class="btn-auth-submit" id="btnRegisterSubmit">Criar Conta do Salão</button>
    </form>
  </div>

  <script>
    function switchAuthTab(mode) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabBtnLogin = document.getElementById('tabBtnLogin');
      const tabBtnRegister = document.getElementById('tabBtnRegister');

      if (mode === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabBtnLogin.classList.add('active');
        tabBtnRegister.classList.remove('active');
        document.getElementById('authSubtitle').innerText = 'Acesso ao Painel do Salão & Profissionais';
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabBtnLogin.classList.remove('active');
        tabBtnRegister.classList.add('active');
        document.getElementById('authSubtitle').innerText = 'Cadastre seu Salão para usar o sistema';
      }
    }

    window.asyncAlert = function(message, title = 'Aviso', type = 'info') {
      return new Promise((resolve) => {
        const modal = document.getElementById('customAlertModal');
        if (!modal) {
          window.alert(message);
          resolve();
          return;
        }
        const titleEl = document.getElementById('customAlertTitle');
        const msgEl = document.getElementById('customAlertMessage');
        const okBtn = document.getElementById('customAlertOkBtn');
        const iconEl = document.getElementById('customAlertIcon');

        if (titleEl) titleEl.innerText = title;
        if (msgEl) msgEl.innerText = message;

        if (type === 'error' || type === 'danger') {
          if (iconEl) {
            iconEl.style.background = 'rgba(211, 47, 47, 0.12)';
            iconEl.style.color = '#d32f2f';
            iconEl.innerHTML = `<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
          }
        } else if (type === 'success') {
          if (iconEl) {
            iconEl.style.background = 'rgba(26, 102, 54, 0.14)';
            iconEl.style.color = '#1a6636';
            iconEl.innerHTML = `<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
          }
        } else {
          if (iconEl) {
            iconEl.style.background = 'rgba(255, 105, 0, 0.12)';
            iconEl.style.color = '#ff6900';
            iconEl.innerHTML = `<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
          }
        }

        modal.classList.add('active');

        function onOk() {
          modal.classList.remove('active');
          okBtn.removeEventListener('click', onOk);
          resolve();
        }

        okBtn.addEventListener('click', onOk);
      });
    };

    window.alert = function(msg) {
      window.asyncAlert(msg, 'Aviso', 'info');
    };

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerText = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) {
          await asyncAlert(data.error || 'Erro ao realizar login.', 'Erro de Acesso', 'error');
          btn.disabled = false;
          btn.innerText = 'Entrar no Sistema';
          return;
        }

        // Salva sessão no localStorage
        localStorage.setItem('salon_token', data.token);
        localStorage.setItem('salon_user', JSON.stringify(data.user));
        localStorage.setItem('salon_tenant', JSON.stringify(data.tenant));

        // Redireciona para o painel principal
        window.location.href = '/app';
      } catch (err) {
        console.error(err);
        await asyncAlert('Erro de comunicação com o servidor.', 'Erro de Conexão', 'error');
        btn.disabled = false;
        btn.innerText = 'Entrar no Sistema';
      }
    }

    async function handleRegisterSalon(e) {
      e.preventDefault();
      const salonName = document.getElementById('regSalonName').value.trim();
      const slug = document.getElementById('regSalonSlug').value.trim();
      const phone = document.getElementById('regSalonPhone').value.trim();
      const address = document.getElementById('regSalonAddress').value.trim();
      const adminName = document.getElementById('regAdminName').value.trim();
      const username = document.getElementById('regAdminUser').value.trim();
      const adminEmail = document.getElementById('regAdminEmail').value.trim();
      const adminPassword = document.getElementById('regAdminPassword').value;
      const btn = document.getElementById('btnRegisterSubmit');

      btn.disabled = true;
      btn.innerText = 'Criando Salão...';

      try {
        const res = await fetch('/api/auth/register-salon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            salonName,
            slug,
            phone,
            address,
            adminName,
            username,
            adminEmail: adminEmail || `${username}@salao.local`,
            adminPassword
          })
        });

        const data = await res.json();
        if (!res.ok) {
          await asyncAlert(data.error || 'Erro ao cadastrar salão.', 'Erro', 'error');
          btn.disabled = false;
          btn.innerText = 'Criar Conta do Salão';
          return;
        }

        // Auto login
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password: adminPassword })
        });
        const loginData = await loginRes.json();

        localStorage.setItem('salon_token', loginData.token);
        localStorage.setItem('salon_user', JSON.stringify(loginData.user));
        localStorage.setItem('salon_tenant', JSON.stringify(loginData.tenant));

        await asyncAlert(`Salão ${salonName} cadastrado com sucesso! Redirecionando para o seu novo painel.`, 'Sucesso', 'success');
        window.location.href = '/app';
      } catch (err) {
        console.error(err);
        await asyncAlert('Erro de comunicação com o servidor.', 'Erro de Conexão', 'error');
        btn.disabled = false;
        btn.innerText = 'Criar Conta do Salão';
      }
    }

    // Se já estiver logado, redireciona para o CRM
    if (localStorage.getItem('salon_user')) {
      window.location.href = '/app';
    }

    window.asyncAlert = function(message, title = 'Aviso', type = 'info') {
      return new Promise((resolve) => {
        const modal = document.getElementById('customAlertModal');
        if (!modal) {
          window.alert(message);
          resolve();
          return;
        }
        const titleEl = document.getElementById('customAlertTitle');
        const msgEl = document.getElementById('customAlertMessage');
        const okBtn = document.getElementById('customAlertOkBtn');
        const iconEl = document.getElementById('customAlertIcon');

        if (titleEl) titleEl.innerText = title;
        if (msgEl) msgEl.innerText = message;

        if (type === 'error' || type === 'danger') {
          if (iconEl) {
            iconEl.style.background = 'rgba(211, 47, 47, 0.12)';
            iconEl.style.color = '#d32f2f';
            iconEl.innerHTML = `<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
          }
        } else if (type === 'success') {
          if (iconEl) {
            iconEl.style.background = 'rgba(26, 102, 54, 0.14)';
            iconEl.style.color = '#1a6636';
            iconEl.innerHTML = `<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
          }
        } else {
          if (iconEl) {
            iconEl.style.background = 'rgba(255, 105, 0, 0.12)';
            iconEl.style.color = '#ff6900';
            iconEl.innerHTML = `<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
          }
        }

        modal.classList.add('active');

        function onOk() {
          modal.classList.remove('active');
          okBtn.removeEventListener('click', onOk);
          resolve();
        }

        okBtn.addEventListener('click', onOk);
      });
    };
  </script>

  <!-- Modal de Alerta Customizado (Substitui alert nativo) -->
  <div class="modal-backdrop" id="customAlertModal" style="z-index: 10001;">
    <div class="modal-dialog" style="max-width: 400px; text-align: center; border-radius: 20px; padding: 24px 20px;">
      <div id="customAlertIcon" style="width: 54px; height: 54px; border-radius: 50%; background: rgba(255, 105, 0, 0.12); color: #ff6900; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
        <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      </div>
      <h3 id="customAlertTitle" style="font-size: 1.12rem; font-weight: 700; color: var(--ink); margin-bottom: 8px;">Aviso</h3>
      <p id="customAlertMessage" style="font-size: 0.88rem; color: var(--muted); line-height: 1.45; margin-bottom: 20px; white-space: pre-line;"></p>
      <button class="btn-falcon btn-primary" id="customAlertOkBtn" style="width: 100%; padding: 10px; font-weight: 600;">Entendi</button>
    </div>
  </div>
</body>
</html>
